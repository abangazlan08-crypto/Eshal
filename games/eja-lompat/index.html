<title>Eja Lompat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D lava run; HUD hugs the edges, panels are chunky stone slabs with push-buttons */
:root{
  --sky:#ffc9a3; --paper:#fffaf2; --ink:#2a1a10; --muted:#7a6656; --stone:#e9e2d8; --stone-dk:#b9afa2;
  --red:#e5484d; --blue:#2f7cf6; --green:#1fae5b; --gold:#ffc23d; --lava:#ff5b1f;
  --hud:rgba(42,26,16,.82); --shadow:rgba(42,26,16,.30);
  --f-ui:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#game{position:fixed;inset:0;outline:none}
#game canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* push buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:10px 18px;font-weight:800;font-size:20px;letter-spacing:.02em;color:#fff;background:var(--c,var(--green));box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 4px 0 var(--shadow);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 1px 0 var(--shadow)}
.btn.dark{--c:#3a2a20}
.btn.ghost{--c:var(--stone);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--hud);color:#fff;border-radius:14px;height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.pill.icon{width:44px;padding:0;justify-content:center}
.pill svg{width:22px;height:22px}
.spacer{flex:1}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 20%,var(--gold) 21% 62%,#d9921b 63%);box-shadow:inset 0 0 0 2px #b8770f;flex:none}
#stagePill small{font-weight:600;opacity:.75;font-size:14px}

/* question card */
#card{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(540px,calc(100% - 24px));background:var(--paper);border-radius:22px;box-shadow:0 7px 0 var(--shadow);padding:10px 14px 14px;z-index:4;box-sizing:border-box;transition:transform .25s}
#card.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.85)}70%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}
.cardTop{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--muted)}
.cardTop span{flex:1;min-width:0}
.sayBtn{width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none}
.sayBtn svg{width:22px;height:22px}
.cardBody{display:flex;align-items:center;gap:14px;margin-top:6px;min-height:72px}
.pic{font-size:62px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;flex:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.slot{font-family:var(--f-read);font-weight:700;font-size:34px;line-height:1;padding:8px 12px 10px;border-radius:12px;background:var(--stone);color:var(--stone-dk);min-width:28px;text-align:center}
.slot.done{background:#d8f5e3;color:#11713a}
.slot.cur{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 3px transparent}}
.bigWord{font-family:var(--f-read);font-weight:700;font-size:48px;line-height:1.1;letter-spacing:.02em}
.bigWord.ok{color:#11713a}

/* bottom controls */
.ctl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));z-index:5}
.ctl .btn{height:76px}
.arrow{--c:#3a2a20;width:88px;font-size:30px}
#jumpBtn{flex:1;max-width:280px;font-size:26px}
.ans{flex:1;max-width:190px;font-family:var(--f-read);font-size:38px;font-weight:700;padding:0 6px}
.ans.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:44px}
.ans.off{--c:#a99f94 !important;opacity:.55;text-decoration:line-through;pointer-events:none}
.ans.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keys{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 100px);font-size:13px;color:var(--ink);opacity:.6;font-weight:600;z-index:4}
@media (hover:none){.keys{display:none}}

/* banner + floats */
#banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:6;pointer-events:none;font-weight:800;font-size:clamp(34px,8vw,64px);color:#fff;text-align:center;white-space:nowrap;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-size:.45em;-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink)}
.float{position:fixed;z-index:6;pointer-events:none;font-weight:800;font-size:28px;color:var(--gold);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}

/* panels */
.wrap{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 64px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;pointer-events:none}
.wrap.center{justify-content:center;background:rgba(42,26,16,.35)}
.panel>*{flex-shrink:0}
.panel{pointer-events:auto;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:26px;box-shadow:0 8px 0 var(--shadow);padding:18px 18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
@media (max-aspect-ratio:5/6){.wrap{align-items:flex-end;justify-content:center}
  #menu .panel,#shop .panel{gap:7px;padding:14px 14px 16px}
  #menu .logo{font-size:36px;display:flex;gap:8px}#menu .logo span{display:inline}
  #menu .tag{display:none}#menu .lbl{margin-top:0}#menu .row{margin-top:2px}
  #nameIn{padding:7px 12px;font-size:20px}
  .seg button,.levels button{padding:6px 4px}}
.logo{margin:0;font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.01em}
.logo span{color:var(--lava);display:block}
.tag{margin:0;color:var(--muted);font-size:16px;line-height:1.3}
.lbl{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
#nameIn{font:700 22px var(--f-read);padding:10px 14px;border-radius:14px;border:3px solid var(--stone);background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button,.levels button{border-radius:14px;padding:8px 6px;background:var(--stone);font-weight:800;font-size:17px;line-height:1.1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.seg button small,.levels button small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
.seg button[aria-pressed="true"],.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button[aria-pressed="true"] small,.levels button[aria-pressed="true"] small{color:#f5d9c4}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.levels .st{display:block;color:var(--gold);font-size:14px;letter-spacing:1px;margin-top:2px;min-height:16px}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{flex:1;height:60px}
.btn.go{--c:var(--green);font-size:24px}
h2{margin:0;font-size:32px;font-weight:800;line-height:1}
.stars{font-size:54px;letter-spacing:6px;color:var(--stone);text-align:center;line-height:1}
.stars b{color:var(--gold);-webkit-text-stroke:2px #b8770f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats div{background:var(--stone);border-radius:14px;padding:6px}
.stats b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--stone);border-radius:12px;padding:4px 10px;font:700 20px var(--f-read)}
.chips i{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{border-radius:14px;background:var(--stone);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.item .sw{width:34px;height:34px;border-radius:10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.item .hatIco{font-size:26px;height:34px;display:grid;place-items:center}
.item .price{display:flex;align-items:center;gap:3px;font-size:13px}
.item .price .coin{width:13px;height:13px}
.item[aria-pressed="true"]{background:var(--ink);color:#fff}
.item.shake{animation:shake .3s}
.note{min-height:20px;color:var(--red);font-weight:700;font-size:15px}
#mods{background:var(--sky);pointer-events:auto;overflow:auto;align-items:flex-start;justify-content:center}
#mods .panel{max-height:none;overflow:visible;width:min(560px,100%)}
.modHead{display:flex;gap:12px;align-items:center}
.modHead .tag{margin-top:4px}
.back{width:52px;height:52px;padding:0;flex:none}
.modList{display:flex;flex-direction:column;gap:8px}
.mod{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:18px;background:var(--stone);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.mod>span:nth-child(2){min-width:0}
.mod .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;background:#fff;color:var(--ink)}
.mod b{display:block;font-size:18px;line-height:1.15}
.mod small{display:block;font:600 15px var(--f-read);color:var(--muted);margin-top:2px}
.mod .st{color:var(--gold);font-size:18px;letter-spacing:1px;white-space:nowrap}
.mod .st i{font-style:normal;color:var(--stone-dk)}
.mod.done .num{background:var(--green);color:#fff}
.mod.next{background:#fff3cf;box-shadow:inset 0 0 0 3px var(--gold),inset 0 -5px 0 rgba(0,0,0,.08)}
.mod.next .num{background:var(--gold)}
.mod .badge{background:var(--lava);color:#fff;border-radius:10px;padding:2px 10px;font-weight:800;font-size:14px}
.mod.locked{opacity:.55}
.mod.locked .num{background:var(--stone-dk);color:#fff}
.mod.review{background:#dbe8ff}
.mod.review .num{background:var(--blue);color:#fff}
.unlock{background:#fff3cf;border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.35;box-shadow:inset 0 0 0 3px var(--gold)}
.unlock b{color:var(--lava);font-size:19px}
.unlock .ex{font-family:var(--f-read);color:var(--muted)}
.daily{font-weight:700;color:#11713a;font-size:15px}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog span{background:var(--stone);border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){#card.pop,.slot.cur{animation:none}}
</style>

<div id="game" tabindex="0" aria-label="Kawasan permainan"></div>

<div id="hud">
  <button class="pill icon" id="homeBtn" aria-label="Keluar ke menu" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="pill" id="stagePill" hidden>Peringkat 1/4 <small id="wordCount">· 0/12</small></div>
  <div class="spacer"></div>
  <div class="pill" aria-label="Syiling"><span class="coin"></span><span id="coinTxt">0</span></div>
  <button class="pill icon" id="soundBtn" aria-label="Bunyi"></button>
</div>

<div id="card" hidden>
  <div class="cardTop"><span id="cInstr"></span><button class="sayBtn" id="cSay" aria-label="Dengar perkataan"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <div class="cardBody"><div class="pic" id="cPic"></div><div class="slots" id="cWord"></div></div>
</div>

<div class="ctl" id="runCtl" hidden>
  <button class="btn arrow" id="leftBtn" aria-label="Ke kiri">&#9664;</button>
  <button class="btn" id="jumpBtn">&#8593; LOMPAT</button>
  <button class="btn arrow" id="rightBtn" aria-label="Ke kanan">&#9654;</button>
</div>
<div class="ctl" id="ansCtl" hidden>
  <button class="btn ans" style="--c:var(--red)" data-l="0"></button>
  <button class="btn ans" style="--c:var(--blue)" data-l="1"></button>
  <button class="btn ans" style="--c:var(--green)" data-l="2"></button>
</div>
<div class="keys" id="keys" hidden>&#8592; &#8594; tukar lorong · Space lompat · 1 2 3 jawab</div>

<div id="banner"></div>

<div class="wrap" id="menu">
  <div class="panel">
    <h1 class="logo">Eja<span>Lompat</span></h1>
    <p class="tag">Lari atas jambatan, lompat lava, pilih jawapan yang betul.</p>
    <label class="lbl" for="nameIn">Nama pemain</label>
    <input id="nameIn" maxlength="12" autocomplete="off" placeholder="Tulis nama">
    <div class="lbl">Bahasa</div>
    <div class="seg" id="langSeg"><button data-v="ms">Bahasa Melayu</button><button data-v="en">English</button></div>
    <div class="lbl">Permainan</div>
    <div class="seg" id="modeSeg"><button data-v="eja">Eja<small id="ejaSub">pilih suku kata</small></button><button data-v="baca">Baca<small>pilih gambar</small></button><button data-v="mix">Campur<small>eja + baca</small></button></div>
    <div class="prog" id="progTxt"></div>
    <div class="row"><button class="btn ghost" id="shopBtn">Kedai</button><button class="btn go" id="playBtn">PILIH MODUL &#9654;</button></div>
  </div>
</div>

<div class="wrap" id="mods" hidden>
  <div class="panel">
    <div class="modHead"><button class="btn ghost back" id="modBack" aria-label="Kembali ke menu">&#9664;</button><div><h2 id="modTitle">Peta modul</h2><p class="tag" id="modSub"></p></div></div>
    <div class="modList" id="modList"></div>
  </div>
</div>

<div class="wrap" id="shop" hidden>
  <div class="panel">
    <h2>Kedai</h2>
    <p class="tag">Guna syiling untuk hias watak kamu.</p>
    <div class="lbl">Baju</div><div class="grid" id="shirtGrid"></div>
    <div class="lbl">Topi</div><div class="grid" id="hatGrid"></div>
    <div class="note" id="shopNote"></div>
    <div class="row"><button class="btn go" id="shopBack">Siap</button></div>
  </div>
</div>

<div class="wrap center" id="results" hidden>
  <div class="panel">
    <h2 id="resTitle">Hebat!</h2>
    <div class="stars" id="stars"></div>
    <div class="stats"><div><b id="resCoins">0</b><span>syiling</span></div><div><b id="resWords">0</b><span>perkataan</span></div><div><b id="resMiss">0</b><span>silap</span></div></div>
    <div class="unlock" id="resUnlock" hidden></div>
    <div class="daily" id="resDaily" hidden></div>
    <div class="lbl">Tekan untuk dengar semula</div>
    <div class="chips" id="resChips"></div>
    <div class="row"><button class="btn ghost" id="resMenu">Peta modul</button><button class="btn go" id="resAgain">Main lagi</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- save ---------------- */
const KEY='ejaLompat.v1';
const DEF={name:'',coins:0,owned:['s0','h0'],shirt:'s0',hat:'h0',lang:'ms',mode:'eja',prog:{},daily:{last:'',streak:0},muted:false};
let S=Object.assign({},DEF);
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object')S=Object.assign(S,r)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- word banks ---------------- */
const MODS_RAW={
ms:[
['Suku kata terbuka','bola, buku, kuda','bo-la ⚽|bu-ku 📖|ku-da 🐴|ma-ta 👁️|ro-ti 🍞|su-su 🥛|gi-gi 🦷|ka-ki 🦶'],

['Suku kata tertutup','kucing, jalan, rumah','ku-cing 🐱|ja-lan 🛣️|bu-lan 🌙|ru-mah 🏠|ka-pal 🚢|te-lur 🥚|ga-jah 🐘|ka-tak 🐸'],
['Suku kata tertutup 2','kasut, semut, ketam','ka-sut 👟|se-mut 🐜|ke-tam 🦀|ti-kus 🐭|le-bah 🐝|hu-jan 🌧️|ro-ket 🚀|po-kok 🌳|sa-yur 🥬'],
['Bunyi ng dan ny','bintang, bunga, penyu','bin-tang ⭐|pi-sang 🍌|kam-bing 🐐|bu-rung 🐦|bu-nga 🌸|pa-yung ☂️|hi-dung 👃|gun-ting ✂️|lo-ceng 🔔|pe-nyu 🐢|ja-gung 🌽|nya-muk 🦟'],

['Tiga suku kata','kereta, kelapa, kerusi','ke-re-ta 🚗|ke-la-pa 🥥|ke-ru-si 🪑|bu-a-ya 🐊|ba-si-kal 🚲|se-ko-lah 🏫|te-le-fon 📱|be-ru-ang 🐻|ke-la-war 🦇'],

],
en:[

    for(const ch of shuffle([...(CONF[piece]||'aeo')])){if(ch!==piece){out.add(ch);break}}

  }

function roundWords(){
  const N=STAGES*WPS,mods=MODS[S.lang];let main=[],extra=[];
  if(G.module==='review'){const d=prog().done;for(const i of(d.length?d:[0]))main=main.concat(mods[i].words)}
  else{main=mods[G.module].words.slice();for(let i=0;i<G.module;i++)extra=extra.concat(mods[i].words)}
  let list=shuffle(main).slice(0,N);extra=shuffle(extra);
  while(list.length<N)list.push(extra.length?extra.pop():pick(main));
  return shuffle(list);
}
function genRound(){
  clearRows();gz=0;G.rows=[];G.qs=[];
  const list=roundWords();
  addRow(8,'start',{cp:true});
  for(let s=0;s<STAGES;s++){
    for(let w=0;w<WPS;w++){
      const W=list[s*WPS+w];
      const mode=S.mode==='mix'?(Math.random()<.5?'eja':'baca'):S.mode;
      const q={pieces:W.pieces,word:W.word,emoji:W.emoji,mode,idx:0,stage:s,n:G.qs.length,lang:S.lang};G.qs.push(q);
      const gates=mode==='eja'?W.pieces.length:1;
      for(let i=0;i<gates;i++){
        addRun(s,i>0);
        const stop=addRow(2.4,'stop',{q,pi:i});
        addRow(1.6,'gap',{lanes:[0,0,0]});
        const correct=mode==='eja'?W.pieces[i]:W.emoji;
        const others=mode==='eja'?distractors(correct,S.lang):pictureDistractors(W);
        const opts=shuffle([correct].concat(others));
        stop.gate=addRow(2.4,'gate',{q,pi:i,opts,correct:opts.indexOf(correct),isEmoji:mode==='baca',disabled:[0,0,0],resolved:false,stop});
      }

function clearRows(){for(const r of G.rows)if(r.built)unbuildRow(r)}
function buildRow(r){

    if(!r.lanes[l])continue;
    let hex=STONE;
    if(r.kind==='gate')hex=r.resolved&&l===r.correct?GOLD:GATE_HEX[l];
    else if(r.kind==='finish'||r.kind==='start')hex=FIN;
    else if(r.bridge)hex=WOOD;
    const m=new THREE.Mesh(tileGeo(r.len),tileMat(hex,r.len));m.position.set(LANES[l],-.25,zc);
    scene.add(m);r.meshes.push(m);r.tiles[l]=m;
  }
  if(r.kind==='gate'){
    for(let l=0;l<3;l++){
      const st=r.disabled[l]?'off':(r.resolved&&l===r.correct?'ok':'');
      const s=makeLabel(r.opts[l],r.isEmoji,st);s.position.set(LANES[l],1.95,zc+.4);scene.add(s);r.meshes.push(s);r.labels[l]=s;
      const pole=new THREE.Mesh(boxGeo,postMat);pole.scale.set(.08,1.5,.08);pole.position.set(LANES[l],.75,zc+.4);scene.add(pole);r.meshes.push(pole);
    }
  }
  r.coinMeshes=[];
  for(const c of r.coins){if(c.got)continue;const m=new THREE.Mesh(coinGeo,coinMat);m.position.set(c.x,c.y,c.z);scene.add(m);r.meshes.push(m);c.m=m;r.coinMeshes.push(c)}
  for(const d of r.decor){const m=new THREE.Mesh(boxGeo,rockMat);m.scale.set(d.w,d.h+1,d.w);m.position.set(d.x,-1+(d.h+1)/2,d.z);scene.add(m);r.meshes.push(m)}
  if(r.kind==='finish'||r.kind==='start'){
    const txt=r.kind==='start'?'MULA':(r.stage===STAGES-1?'TAMAT!':'PERINGKAT '+(r.stage+1));
    for(const x of[-2.85,2.85]){const p=new THREE.Mesh(boxGeo,postMat);p.scale.set(.35,3.6,.35);p.position.set(x,1.8,zc);scene.add(p);r.meshes.push(p)}
    const b=new THREE.Mesh(boxGeo,bannerMat(txt,r.kind==='start'?'#ffc23d':'#ff8a5c'));b.scale.set(6.05,.9,.2);b.position.set(0,3.5,zc);scene.add(b);r.meshes.push(b);
  }
  r.built=true;
}
function unbuildRow(r){for(const m of r.meshes)scene.remove(m);r.meshes=[];r.tiles=[];r.labels=[];r.built=false}
function manageRows(){const z=G.p.z;for(const r of G.rows){const want=r.b>z-78&&r.a<z+20;if(want&&!r.built)buildRow(r);else if(!want&&r.built)unbuildRow(r)}}

function groundAt(x,z){

    if(!r.built)continue;
    if(z<=r.a+.28&&z>=r.b-.28){for(let l=0;l<3;l++)if(r.lanes[l]&&Math.abs(x-LANES[l])<.98)return{r,l}}

function updatePlayer(dt){
  const p=G.p,st=G.state;
  if(st==='ready'){G.readyT-=dt;if(G.readyT<=0){G.state='run';setControls();showBanner(S.lang==='ms'?'Mula!':'Go!',600)}}
  if(st==='fall'){G.fallT+=dt;p.y-=1.6*dt;if(G.fallT>1.0)respawn();return}
  let moving=st==='run'||st==='answering';
  if(st==='win'){moving=p.z>G.endRow.a-5;G.winT+=dt;if(G.winT>2.6)showResults()}
  if(moving)p.z-=G.speed*(1+G.stage*.04)*dt;
  p.x+=clamp(LANES[p.lane]-p.x,-9*dt,9*dt);
  p.vy-=GRAV*dt;p.y+=p.vy*dt;
  const gr=groundAt(p.x,p.z);
  if(p.y<=0&&p.vy<=0&&gr&&p.y>-.45){
    if(!p.onGround){p.onGround=true;land(gr);if(G.jumpBuf>0&&G.state==='run'){p.vy=JUMP;p.onGround=false;p.air=1;G.jumpBuf=0;SFX.jump()}}
    if(p.onGround){p.y=0;p.vy=0;p.air=0}
  }else{p.onGround=false;p.air+=dt}
  G.jumpBuf=Math.max(0,G.jumpBuf-dt);
  if(p.y<-1.0){startFall();return}
  if(G.state==='run'){
    const ns=G.stops[G.stopIdx];
    if(ns&&p.z<=ns.b+.55){p.z=ns.b+.55;enterAsk(ns)}
  }
  for(const r of G.rows){
    if(r.passed||!r.built||p.z>r.a-.3)continue;
    r.passed=true;
    if(r.cp&&r.kind!=='stop')G.cpRow=r;
    if(r.kind==='finish')stageClear(r);
  }
  for(const r of G.rows){if(!r.built||!r.coinMeshes)continue;
    for(const c of r.coinMeshes){if(c.got)continue;c.m.rotation.y+=dt*3;
      if(Math.abs(c.x-p.x)<.7&&Math.abs(c.z-p.z)<.7&&Math.abs(c.y-(p.y+.9))<1.1){c.got=true;scene.remove(c.m);addCoins(1);SFX.coin()}}}
}
function animateAvatar(dt){
  const p=G.p,st=G.state;
  AV.position.set(p.x,p.y,p.z);
  shadow.visible=p.y>-.2&&st!=='fall';shadow.position.set(p.x,.01,p.z);shadow.scale.setScalar(clamp(1-p.y*.25,.4,1));
  const running=(st==='run'||st==='answering'||(st==='win'&&p.z>G.endRow.a-5))&&p.onGround;
  G.phase+=dt*(running?13:3);
  const s=Math.sin(G.phase);
  if(st==='win'&&!running||st==='results'){armL.rotation.set(0,0,-2.6+Math.sin(G.t*10)*.3);armR.rotation.set(0,0,2.6-Math.sin(G.t*10)*.3);legL.rotation.x=legR.rotation.x=0;body.position.y=Math.abs(Math.sin(G.t*8))*.25}
  else if(running){legL.rotation.x=s*.9;legR.rotation.x=-s*.9;armL.rotation.set(-s*.9,0,0);armR.rotation.set(s*.9,0,0);body.position.y=Math.abs(Math.cos(G.phase))*.08}
  else if(!p.onGround){legL.rotation.x=.6;legR.rotation.x=-.5;armL.rotation.set(0,0,-2.3);armR.rotation.set(0,0,2.3);body.position.y=0}
  else{legL.rotation.x=legR.rotation.x=0;armL.rotation.set(s*.05,0,-.08);armR.rotation.set(-s*.05,0,.08);body.position.y=Math.sin(G.t*2)*.02;
    if(st==='menu'||st==='shop'){armR.rotation.set(0,0,2.5+Math.sin(G.t*6)*.35)}}
  body.rotation.z=(p.x-LANES[p.lane])*.12;
  if(G.blink>0){G.blink-=dt;AV.visible=Math.floor(G.blink*12)%2===0}else AV.visible=st!=='fall'||G.fallT<.25;
}
const camPos=new THREE.Vector3(0,4,6),camLook=new THREE.Vector3();
function updateCamera(dt){
  const portrait=innerWidth/innerHeight<.85,p=G.p;
  let pos,look;
  if(G.state==='menu'||G.state==='shop'){
    if(portrait){pos=new THREE.Vector3(0,3.2,p.z+7.4);look=new THREE.Vector3(0,-2.4,p.z)}
    else{pos=new THREE.Vector3(1.7,1.7,p.z+5.2);look=new THREE.Vector3(1.7,1.15,p.z)}
    camera.fov=portrait?62:50;
  }else{
    const fz=G.state==='fall'?G.cpRow&&G.cpRow.kind==='stop'?p.z:p.z:p.z;
    const ask=G.state==='ask'||G.state==='answering';
    pos=new THREE.Vector3(p.x*.45,(portrait?4.6:3.7)+(ask?1.8:0),fz+(portrait?6.9:6.2)+(ask?.6:0));
    look=new THREE.Vector3(p.x*.35,ask?.2:.7,fz-(ask?4.2:5.5));
    camera.fov=portrait?68:56;
  }
  const k=1-Math.exp(-dt*6);camPos.lerp(pos,k);camLook.lerp(look,k);
  camera.position.copy(camPos);camera.lookAt(camLook);camera.updateProjectionMatrix();
  lava.position.z=p.z-40;
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;lavaMat.uniforms.t.value=G.t;
  if(G.state==='mods')return;
  if(G.state!=='menu'&&G.state!=='shop'&&G.state!=='results')updatePlayer(dt);
  if(G.state==='results'){G.p.y=0}
  manageRows();animateAvatar(dt);updateParts(dt);
  for(let i=sinkers.length-1;i>=0;i--){const s=sinkers[i];s.v+=9*dt;s.m.position.y-=s.v*dt;if(s.m.position.y<-4){scene.remove(s.m);sinkers.splice(i,1)}}
  updateCamera(dt);renderer.render(scene,camera);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------------- menu + shop ---------------- */
function segSet(id,val){document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(val))))}
function renderMenu(){
  segSet('langSeg',S.lang);segSet('modeSeg',S.mode);
  $('#ejaSub').textContent=S.lang==='ms'?'pilih suku kata':'pick letters';
  const P=prog(),n=MODS[S.lang].length,st=S.daily&&S.daily.streak&&(S.daily.last===dayStr(0)||S.daily.last===dayStr(-1))?S.daily.streak:0;
  $('#progTxt').innerHTML='<span>'+P.done.length+'/'+n+' modul selesai</span>'+(st?'<span>Main '+st+' hari berturut-turut</span>':'');
  $('#nameIn').value=S.name||'';
}
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audio();S.lang=b.dataset.v;persist();renderMenu();SFX.tap()});
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audio();S.mode=b.dataset.v;persist();renderMenu();SFX.tap()});
$('#nameIn').addEventListener('input',e=>{S.name=e.target.value.slice(0,12);persist();updateNameTag()});
$('#playBtn').addEventListener('click',()=>{audio();SFX.tap();openMods()});
$('#shopBtn').addEventListener('click',()=>{audio();SFX.tap();G.state='shop';$('#menu').hidden=true;$('#shop').hidden=false;$('#shopNote').textContent='';renderShop()});
$('#shopBack').addEventListener('click',()=>{SFX.tap();$('#shop').hidden=true;G.state='menu';$('#menu').hidden=false;renderMenu()});
function renderShop(){
  const mk=(list,boxId,slot)=>{const box=$(boxId);box.innerHTML='';
    for(const it of list){const b=document.createElement('button');b.className='item';const own=S.owned.includes(it.id);
      b.setAttribute('aria-pressed',String(S[slot]===it.id));
      b.innerHTML=(slot==='shirt'?'<span class="sw" style="background:#'+it.c.toString(16).padStart(6,'0')+'"></span>':'<span class="hatIco">'+it.ico+'</span>')+it.name+
        (own?'<span class="price">'+(S[slot]===it.id?'Dipakai':'Pakai')+'</span>':'<span class="price"><span class="coin"></span>'+it.p+'</span>');
      b.addEventListener('click',()=>{
        if(!S.owned.includes(it.id)){
          if(S.coins<it.p){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#shopNote').textContent='Syiling tak cukup. Perlu '+(it.p-S.coins)+' lagi.';SFX.bad();return}
          S.coins-=it.p;S.owned.push(it.id);SFX.coin();updateCoins();$('#shopNote').textContent='';
        }else SFX.tap();
        S[slot]=it.id;persist();applyLook();renderShop();
      });box.appendChild(b)}};
  mk(SHIRTS,'#shirtGrid','shirt');mk(HATS,'#hatGrid','hat');
}
const LOCK='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 10V8a5 5 0 0110 0v2h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1zm2 0h6V8a3 3 0 00-6 0z"/></svg>';
function openMods(){
  G.state='mods';$('#menu').hidden=true;$('#results').hidden=true;$('#mods').hidden=false;renderMods();
  const nx=document.querySelector('.mod.next');if(nx)nx.scrollIntoView({block:'center'});
}
function renderMods(){
  const P=prog(),mods=MODS[S.lang],box=$('#modList');box.innerHTML='';
  $('#modTitle').textContent=S.lang==='ms'?'Peta modul BM':'Peta modul English';
  $('#modSub').textContent='Habiskan satu modul untuk buka modul seterusnya. Mod: '+({eja:'Eja',baca:'Baca',mix:'Campur'})[S.mode]+'.';
  const nextI=mods.findIndex((m,i)=>isOpen(i)&&!P.done.includes(i));
  mods.forEach((m,i)=>{
    const open=isOpen(i),done=P.done.includes(i),stars=P.stars[i]||0;
    const b=document.createElement('button');b.className='mod'+(done?' done':'')+(i===nextI?' next':'')+(open?'':' locked');
    b.innerHTML='<span class="num">'+(done?'&#10003;':open?(i+1):LOCK)+'</span><span><b>Modul '+(i+1)+' · '+m.t+'</b><small>'+m.ex+'</small></span>'+
      (i===nextI?'<span class="badge">'+(P.done.length?'BARU':'MULA')+'</span>':done?'<span class="st" aria-label="'+stars+' bintang">'+'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i></span>':'<span></span>');
    if(open)b.addEventListener('click',()=>{G.module=i;startRound()});
    else{b.setAttribute('aria-disabled','true');b.addEventListener('click',()=>{SFX.bad();showBanner('<small>Habiskan Modul '+i+' dulu</small>',1200)})}
    box.appendChild(b);
  });
  const r=document.createElement('button');const ro=P.done.length>0;
  r.className='mod review'+(ro?'':' locked');
  r.innerHTML='<span class="num">&#8635;</span><span><b>Ulang kaji</b><small>'+(ro?'Campur semua perkataan dari modul yang dah selesai':'Buka selepas Modul 1')+'</small></span><span></span>';
  if(ro)r.addEventListener('click',()=>{G.module='review';startRound()});
  box.appendChild(r);
}
$('#modBack').addEventListener('click',()=>{SFX.tap();$('#mods').hidden=true;G.state='menu';$('#menu').hidden=false;renderMenu()});
let homeArmed=0;
$('#homeBtn').addEventListener('click',()=>{
  if(Date.now()-homeArmed<2500){persist();toMenu();return}
  homeArmed=Date.now();showBanner('<small>Tekan X sekali lagi untuk keluar</small>',1600);
});
$('#resMenu').addEventListener('click',()=>{SFX.tap();toMenu();openMods()});
$('#resAgain').addEventListener('click',()=>{SFX.tap();if(G.nextModule!=null)G.module=G.nextModule;startRound()});
$('#soundBtn').addEventListener('click',()=>{S.muted=!S.muted;persist();updateSound();if(S.muted&&'speechSynthesis' in window)speechSynthesis.cancel();else{audio();SFX.tap()}});
$('#cSay').addEventListener('click',()=>{const q=G.curStop&&G.curStop.q;if(q)say(q.word,q.lang)});

/* ---------------- input ---------------- */
const press=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()});
press('#leftBtn',()=>move(-1));press('#rightBtn',()=>move(1));press('#jumpBtn',doJump);
document.querySelectorAll('.ans').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(+b.dataset.l)}));
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){move(-1);e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){move(1);e.preventDefault()}
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){doJump();e.preventDefault()}
  else if(k==='1'||k==='2'||k==='3')answer(+k-1);
  else if(k==='Enter'&&G.state==='menu')openMods();
});
let tStart=null;
host.addEventListener('touchstart',e=>{const t=e.touches[0];tStart={x:t.clientX,y:t.clientY}},{passive:true});
host.addEventListener('touchend',e=>{if(!tStart)return;const t=e.changedTouches[0],dx=t.clientX-tStart.x,dy=t.clientY-tStart.y;tStart=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-40)doJump()},{passive:true});

/* ---------------- boot ---------------- */
window.__ejaLompat={G,answer,startRound};
updateCoins();updateSound();applyLook();resize();
let booted=false;
const boot=()=>{if(booted)return;booted=true;updateNameTag();toMenu();requestAnimationFrame(loop)};
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 64px Andika'),document.fonts.load('800 40px "Baloo 2"')]).catch(()=>{}).then(boot);setTimeout(boot,2500)}else boot();
})();
</script>
